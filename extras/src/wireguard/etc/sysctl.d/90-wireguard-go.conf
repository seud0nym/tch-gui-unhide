# Written by tch-gui-unhide-xtra.wireguard, and removed when that extra is removed.
# The Broadcom Ethernet driver frees sent packets lazily (when more than 64 are pending, or once a second),
# so a UDP socket with the default 204800 byte send buffer stalls after about 43 packets. That holds
# wireguard-go to a few Mbit/s LAN->WAN. This is a per-socket ceiling for sockets that do not set
# their own send buffer, not an allocation.
net.core.wmem_default=2097152
